name: CI Automatizado con SUSFS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel Rosemary
    runs-on: ubuntu-20.04
    steps:
      - name: Configurar Entorno e Inyectar Parches SUSFS
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git
          
          # Crear una carpeta temporal para descargar el codigo fuente de rosemary
          git clone --depth=1 -b 13.0 https://github.com $GITHUB_WORKSPACE/kernel-source
          cd $GITHUB_WORKSPACE/kernel-source
          
          # Descargar los parches oficiales de SUSFS 4.14
          wget https://gitlab.com
          unzip susfs4ksu-kernel-4.14.zip
          
          # Colocar los archivos en sus carpetas correspondientes
          cp susfs4ksu-kernel-4.14/kernel_patches/fs/susfs.c ./fs/ || true
          cp susfs4ksu-kernel-4.14/kernel_patches/include/linux/susfs.h ./include/linux/ || true
          
          # Aplicar las modificaciones de codigo de camuflaje
          patch -p1 < susfs4ksu-kernel-4.14/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          
          if [ -d "kernelsu" ]; then
            cd kernelsu && patch -p1 < ../susfs4ksu-kernel-4.14/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true && cd ..
          fi
          
          # Encender las banderas en el archivo defconfig para que salgan en VERDE
          echo "CONFIG_KSU_SUSFS_SUS_MAPS=y" >> arch/arm64/configs/rosemary_defconfig
          echo "CONFIG_KSU_SUSFS_OVERLAYFS_AUTO_KSTAT=y" >> arch/arm64/configs/rosemary_defconfig
          
          # Mover todo el codigo parchado a la ruta limpia que usara el compilador externo
          mkdir -p $GITHUB_WORKSPACE/patched-kernel
          cp -r * $GITHUB_WORKSPACE/patched-kernel/

      - name: Ejecutar Constructor de Android
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: local
          kernel-dir: patched-kernel
          config: rosemary_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}

name: Compilacion Kernel Evolution Rosemary con SUSFS Completo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Descargar Codigo Fuente del Kernel
      uses: actions/checkout@v4

    - name: Configurar Entorno de Compilacion
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev libelf-dev bison flex acpica-tools libltdl-dev wget unzip git cpio python2 python3

    - name: Descargar Herramientas de Compilacion (Clang Rosemary Oficial)
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        wget https://googlesource.com
        tar -xf clang-r383902.tar.gz

    - name: Descargar e Inyectar Parches de Ocultamiento SUSFS (Rama 4.14)
      run: |
        cd $GITHUB_WORKSPACE
        wget https://gitlab.com
        unzip susfs4ksu-kernel-4.14.zip
        
        cp susfs4ksu-kernel-4.14/kernel_patches/fs/susfs.c ./fs/ || true
        cp susfs4ksu-kernel-4.14/kernel_patches/include/linux/susfs.h ./include/linux/ || true
        
        patch -p1 < susfs4ksu-kernel-4.14/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
        
        if [ -d "KernelSU" ]; then
          cd KernelSU
          patch -p1 < ../susfs4ksu-kernel-4.14/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ..
        fi

    - name: Compilar el Kernel (Generar Image.gz-dtb)
      run: |
        cd $GITHUB_WORKSPACE
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        
        # Ignorar advertencias menores de codigo antiguo
        export KCFLAGS="-w"
        
        make O=out rosemary_defconfig
        make -j$(nproc) O=out

    - name: Subir Archivo Compilado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Evolution-SUSFS-Rosemary
        path: out/arch/arm64/boot/Image.gz-dtb
